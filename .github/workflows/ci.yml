name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and launchers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: backend
      DATABASE_URL: sqlite://
      INVESTMENT_BOARD_ENV_FILE: /dev/null
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and test dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -e 'backend[dev]'
      - name: Check shell syntax
        run: bash -n scripts/run_all.sh scripts/run_backend.sh scripts/run_frontend.sh scripts/smoke_watchlist.sh
      - name: Test backend
        run: backend/.venv/bin/python -m pytest backend/tests -q
      - name: Test isolated launchers and smoke lifecycle
        run: backend/.venv/bin/python -m pytest scripts/tests -q

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Test frontend
        run: npm test
      - name: Build frontend
        run: npm run build
